<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wolf on Table AR</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body { margin: 0; background-color: #f0f0f0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; }
        model-viewer { width: 100%; height: 90%; background-color: #eee; }
        .ar-button { background-color: #007bff; border-radius: 8px; border: none; color: white; padding: 12px 24px; font-size: 18px; margin-bottom: 20px; cursor: pointer; }
    </style>
</head>
<body>

    <model-viewer 
        src="model.glb" 
        ios-src="model.usdz"
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        auto-rotate 
        shadow-intensity="1"
        autoplay
        animation-name="*"> <button slot="ar-button" class="ar-button">
            ✨ тест
        </button>

        <div slot="progress-bar">Загрузка...</div>
    </model-viewer>

</body>
</html>
