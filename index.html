<!DOCTYPE html>
<html lang="ru">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ichwillnicht</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.2.0/dist/aframe-extras.min.js"></script>

    <style>
        body { margin: 0; overflow: hidden; }
        /* Экран загрузки */
        #loading {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #111; color: white; display: flex;
            justify-content: center; align-items: center;
            font-family: sans-serif; z-index: 999;
        }
    </style>
</head>
<body>
    <div id="loading">Загрузка...</div>

    <a-scene 
        mindar-image="imageTargetSrc: ./marker.mind; autoStart: true;" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights: true" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <a-asset-item id="wolfModel" src="./model.glb"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
            <a-gltf-model 
                src="#wolfModel" 
                scale="0.5 0.5 0.5" 
                position="0 0 0" 
                rotation="0 0 0"
                animation-mixer="clip: *; loop: repeat;">
            </a-gltf-model>
        </a-entity>
    </a-scene>

    <script>
        // Скрываем загрузочный экран, когда сцена готова
        document.querySelector('a-scene').addEventListener('arReady', () => {
            document.getElementById('loading').style.display = 'none';
        });
    </script>
</body>
</html>
